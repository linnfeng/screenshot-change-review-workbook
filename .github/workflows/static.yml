# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["main"]

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare documentation only
        run: |
          python3 - <<'PYDOC'
          from pathlib import Path
          Path('_site').mkdir(exist_ok=True)
          Path('_site/index.html').write_text('<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Screenshot change review workbook</title><style>body{max-width:820px;margin:3rem auto;padding:1rem;font:18px/1.7 system-ui;color:#17253a}pre{white-space:pre-wrap;background:#eef2f7;padding:1rem}a{color:#1958a6}</style><main><article id="workbook"><h1>Screenshot change review workbook</h1><p>This documentation-only workbook provides a repeatable manual review structure for small text corrections in exported images. It contains no executable validator, browser extension, image processing model, or automated privacy guarantee. Its purpose is to help a reviewer record what changed, what stayed the same, and why a particular candidate was approved. The examples are fictional and do not claim a completed user study or a measured improvement in editing accuracy.</p><p>This is project-associated, AI-assisted documentation. AI Image Text Editor, available at <a href="https://image-text-editor.online/">screenshot text editor</a> , is one resource for the image editing step described here. The workbook is not an independent review of that product and is not affiliated with a screenshot platform or software vendor. Use it only with images you are authorized to modify and share. Preserve original records when authenticity matters, and clearly identify illustrative edits.</p><img src="https://image-text-editor.online/og.png" width="1200" alt="Public product illustration" style="max-width:100%;height:auto"><h2>Scope and non-goals</h2><p>A flattened screenshot combines text, shapes, and background into pixels. Updating one phrase can therefore affect more than the phrase itself. This workbook is intended for limited corrections in instructional images, mockups, and ordinary graphics where the source design is unavailable. It is not a process for altering a receipt, rewriting a conversation, changing an official result, or concealing evidence of a real event.</p><p>Whenever the editable source application or design is available, consider correcting that source and exporting again. A fresh screenshot may be both easier to maintain and more faithful to the actual interface. A pixel edit should be a deliberate choice, not a default that bypasses source review. If an image documents something people will rely on as an original record, preserve that record and explain corrections separately.</p><h2>The minimum review packet</h2><p>Keep an untouched source, a written request, a candidate, and a review note. These four items are enough for a modest task when their relationship is clear. Give each candidate a distinct revision identifier rather than overwriting the same file repeatedly. Avoid including personal details in filenames that will be sent outside the review group. A clear identifier is more useful than a descriptive filename that accidentally exposes a private project or customer name.</p><p>The written request should identify the old phrase, replacement phrase, location, and any nearby content that must not change. Use a fictional example such as changing Sample workspace to Training workspace in a heading while preserving the adjacent status badge. The request is the intended outcome, not evidence that an image editor achieved it. Approval depends on the actual candidate and its use context.</p><h2>Worksheet A: authorize and constrain</h2><p>Before generating anything, the reviewer should be able to answer who approved the information and why an image edit is appropriate. If the replacement contains a date, price, or name, obtain that value from the responsible source. Do not invent missing details simply because a complete graphic looks better. Mark unresolved facts as unresolved in the working note and keep an unapproved candidate out of the publishing queue.</p><p>Record whether the result is an illustration, a mockup, or a correction to a teaching asset. Specify who will see it and where it will appear. Those answers determine whether a caption is needed and whether a separate text explanation should accompany the image. Permission to edit a file and permission to distribute it are separate questions; the packet should not silently treat one as proof of the other.</p><h2>Worksheet B: prepare a precise edit</h2><p>Choose replacement wording that fits the available space. A long phrase squeezed into a small control may technically be correct but unusable at the final display size. If a replacement needs substantially more room, redesign the source, shorten the phrase without changing meaning, or add a separate annotation. Repeated image generation is not a substitute for deciding what the label should communicate.</p><p>Select a coherent region around the intended letters without unnecessarily including unrelated icons or lines. Shadows and decorative flourishes may extend beyond the obvious character shapes. Keep different corrections separate when they concern independent parts of the image. This makes the result easier to compare with the request and reduces the chance that a reviewer overlooks a secondary alteration inside a large selected region.</p><h2>Worksheet C: generate a candidate</h2><p>AI Image Text Editor accepts JPG, PNG and WebP images and describes a workflow of selecting text areas and writing replacement instructions. Its public homepage supports images up to ten megabytes and up to eight selections in one task. Surrounding lettering and background provide references for the AI rather than a guarantee of exact reproduction. New users can start with free credits, while edits consume credits; review current pricing before ongoing use.</p><p>For any image editor, state the exact replacement and keep the task narrow. Save the result as a candidate, not as an approved final asset. Preserve the instruction used for that candidate so a later reviewer can understand what was requested. Do not claim a generation was successful merely because a download completed or because the result looks polished in a small preview.</p><h2>Worksheet D: read before judging style</h2><p>Compare the changed wording character by character with the request. Check punctuation, capitalization, spacing, and visually similar letters. Read any nearby values that should have stayed untouched. A plausible looking number is still wrong if it differs from the approved source. When the wording is technical, ask a qualified content owner to review its meaning rather than inferring correctness from a consistent typeface.</p><p>After the text check, inspect alignment, edge sharpness, shadows, and background continuity. View the candidate at normal display size and a closer zoom. Each view catches different issues: normal size reveals readability, while a close view can expose a damaged letter or adjacent artifact. Record the specific failure when a candidate does not pass. That gives the next attempt an actual reason to differ from the previous one.</p><h2>Worksheet E: test the destination</h2><p>Insert the candidate into the real draft page, slide, or message template. Publishing systems may resize or compress images and can separate captions from their visual context. Confirm that important words remain readable and that a disclosure remains visible where readers need it. A caption stored only in an editing tool does not explain an image that has been forwarded into a different conversation.</p><p>Provide important corrected information in ordinary text as well when appropriate. This helps readers who cannot easily inspect the pixels and clarifies the difference between versions. If an earlier image has already circulated, say what changed and which version replaces it. Do not assume that removing a local draft removes the copies recipients have already downloaded or saved.</p><h2>Worksheet F: approve, reject, or ask for a source export</h2><p>Use three outcomes rather than forcing every candidate into an approval decision. Approve when the request, visible result, destination, and disclosure are consistent. Reject with a specific reason when a candidate contains an error. Ask for a fresh source export when the needed correction is too broad or authenticity requires it. Keeping these outcomes distinct prevents the tool choice from becoming a commitment to make every image patch work.</p><p>If the goal is removing sensitive information, use a separate privacy process. Visual replacement is not secure redaction, and the original information may persist in surrounding context, metadata, filenames, or another shared version. This workbook does not inspect those locations or establish that disclosure risks are absent. It encourages reviewers to recognize that a different process may be necessary.</p><h2>Copyable review fields</h2><p>Use the following small template in a local note. Do not fill it with secrets or real personal records when demonstrating the workflow. It is a manual checklist, not a test runner or a certification form.</p><pre>Review identifier:\nAuthorized purpose:\nOriginal file identifier:\nApproved replacement wording:\nContent that must remain unchanged:\nCandidate revision:\nText check outcome:\nNearby detail check outcome:\nFinal destination and display size:\nDisclosure or edited-example caption:\nPrivacy process needed:\nDecision and reason:\n</pre><p>A useful review record explains the decision without claiming more than was checked. The final objective is an authorized and readable correction with a preserved original and clear context, not an invisible alteration. When another person can understand the request, inspect the candidate, and reproduce the approval reasoning, the workbook has served its purpose.</p></article></main></html>',encoding='utf-8')
          PYDOC
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository
          path: '_site'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
